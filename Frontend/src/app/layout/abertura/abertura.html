<div class="abertura" [class.abertura--saindo]="saindo()" role="status" aria-live="polite">
  <div class="abertura__marca">
    <img
      class="abertura__logo"
      src="carehub-logo.png"
      alt="CareHub"
      width="540"
      height="460"
      fetchpriority="high"
    />
  </div>

  <p class="abertura__slogan">Encontre o seu Hospital ideal</p>

  <span class="abertura__girador" aria-hidden="true"></span>
  <span class="abertura__aviso">Carregando…</span>
</div>
