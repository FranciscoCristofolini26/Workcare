<header class="cabecalho" [class.cabecalho--recolhido]="recolhido()" role="banner">
  <div class="cabecalho__topo">
    <button
      type="button"
      class="botao cabecalho__menu"
      (click)="alternarNavegacao.emit()"
      aria-label="Abrir menu de navegação"
      aria-controls="navegacao-principal"
    >
      <app-icone nome="menu" />
    </button>

    <div class="marca">
      <img class="marca__logo" src="carehub-logo.png" alt="" width="128" height="130" />
      <span class="marca__texto">
        <strong class="marca__nome">CareHub</strong>
        <span class="marca__sub">CareHub</span>
      </span>
    </div>

    <button
      type="button"
      class="botao cabecalho__filtros-toggle"
      [attr.aria-expanded]="filtrosAbertos()"
      aria-controls="filtros-mobile"
      (click)="alternarFiltros()"
    >
      <app-icone nome="filtro" [tamanho]="18" />
      Filtros
    </button>
  </div>

  <div
    id="filtros-mobile"
    class="cabecalho__filtros"
    [class.cabecalho__filtros--abertos]="filtrosAbertos()"
  >
    <div class="campo cabecalho__campo">
      <label class="campo__rotulo" for="seletor-municipio">Município</label>
      <select
        id="seletor-municipio"
        class="campo__controle"
        [value]="municipioSelecionado()"
        (change)="aoTrocarMunicipio($any($event.target).value)"
      >
        <option [value]="todos">Todos os municípios</option>
        @for (municipio of municipios(); track municipio) {
          <option [value]="municipio">{{ municipio }}</option>
        }
      </select>
    </div>

    <div class="campo cabecalho__campo">
      <label class="campo__rotulo" for="seletor-plano">Plano de saúde</label>
      <select
        id="seletor-plano"
        class="campo__controle"
        [value]="planoSelecionado()"
        (change)="aoTrocarPlano($any($event.target).value)"
      >
        <option [value]="todosPlanos">Todos os atendimentos</option>
        <option [value]="comPlano">Com plano de saúde</option>
        <option [value]="semPlano">Sem plano de saúde</option>
        <optgroup label="Planos aceitos">
          @for (plano of planos(); track plano) {
            <option [value]="plano">{{ plano }}</option>
          }
        </optgroup>
      </select>
    </div>

    <div class="campo cabecalho__campo cabecalho__campo--busca">
      <label class="campo__rotulo" for="busca-unidade">Buscar unidade</label>
      <div class="cabecalho__busca">
        <app-icone nome="buscar" [tamanho]="20" />
        <input
          id="busca-unidade"
          class="campo__controle"
          type="search"
          autocomplete="off"
          placeholder="Nome da unidade ou bairro"
          [value]="busca()"
          (input)="aoBuscar($any($event.target).value)"
        />
      </div>
    </div>

    <app-filtro-especialidade
      class="cabecalho__especialidade-mobile"
      idCampo="filtro-especialidade-mobile"
    />
  </div>

  <div class="cabecalho__acoes">
    <button
      type="button"
      class="botao cabecalho__recolher"
      [attr.aria-expanded]="!recolhido()"
      aria-controls="filtros-mobile"
      [attr.aria-label]="recolhido() ? 'Expandir o cabeçalho' : 'Recolher o cabeçalho'"
      (click)="alternarRecolhido()"
    >
      <app-icone nome="recolher" [tamanho]="18" />
      <span class="cabecalho__recolher-texto">{{ recolhido() ? 'Expandir' : 'Recolher' }}</span>
    </button>

    @if (!identificado()) {
      <a class="botao cabecalho__login" routerLink="/cadastro">
        <app-icone nome="usuarios" [tamanho]="18" />
        <span class="cabecalho__login-texto">Cadastro</span>
      </a>
    }

    <p class="cabecalho__sincronia">
      <app-icone nome="atualizar" [tamanho]="18" />
      <span>
        Sincronizado às {{ sincronizadoEm() }}
        <span class="cabecalho__sincronia-detalhe">
          {{ indicadores().unidadesOnline }} de {{ indicadores().unidadesTotal }} unidades online
        </span>
      </span>
    </p>
  </div>
</header>
