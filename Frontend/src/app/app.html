@if (aberturaVisivel()) {
  <app-abertura (concluida)="encerrarAbertura()" />
}

@if (!paginaDeCadastro()) {
  <a class="atalho-conteudo" href="#conteudo-principal">Ir para o conteúdo principal</a>

  <app-cabecalho (alternarNavegacao)="alternarNavegacao()" />
}

<div class="aplicacao" [class.aplicacao--login]="paginaDeCadastro()">
  @if (!paginaDeCadastro()) {
    <app-navegacao [aberta]="navegacaoAberta()" (fechar)="fecharNavegacao()" />
  }

  <main
    id="conteudo-principal"
    class="conteudo"
    [class.conteudo--login]="paginaDeCadastro()"
    [class.conteudo--mapa]="paginaDoMapa()"
    tabindex="-1"
  >
    <router-outlet />
  </main>
</div>
